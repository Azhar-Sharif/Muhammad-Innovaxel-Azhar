<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin: 50px; }
        input, button { padding: 10px; margin: 10px; width: 300px; }
        .error { color: red; }
        .success { color: green; font-weight: bold; }
    </style>
</head>
<body>

    <h1>Flask URL Shortener</h1>

    <form action="/shorten" method="POST">
        <input type="text" name="url" placeholder="Enter URL to shorten" required>
        <button type="submit">Shorten</button>
    </form>

    {% if short_url %}
        <p class="success">Shortened URL: <a href="{{ short_url }}" target="_blank">{{ short_url }}</a></p>
    {% endif %}

</body>
</html>
